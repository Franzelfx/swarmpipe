name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The contract that keeps the layering honest: L2/L3 and the L1 plan layer
  # must install and pass with no deep-learning framework anywhere near them.
  torch-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Assert torch is genuinely absent
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('torch') is not None)"
      - run: ruff check .
      - run: pytest -m "not torch" -q

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,torch,lora]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest -q
